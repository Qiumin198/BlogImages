<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雅思核心词精读</title>
    <style>
        :root {
            --primary-color: #00a896;
            --light-highlight: #e6f6f4; /* 浅绿色引导色 */
            --bg-color: #f5f7f9;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-sub: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-color); height: 100vh; overflow: hidden; }

        /* --- 1. 开始界面 --- */
        #start-screen {
            position: fixed; inset: 0; background: white; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-main {
            padding: 15px 50px; background: var(--primary-color); color: white;
            border: none; border-radius: 30px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 168, 150, 0.2); cursor: pointer;
        }

        /* --- 2. 原文阅读界面 --- */
        #article-screen {
            position: fixed; inset: 0; background: white; z-index: 900;
            display: none; flex-direction: column; padding: 30px 20px;
        }
        .article-scroll { flex: 1; overflow-y: auto; margin: 20px 0; position: relative; }
        .article-content { line-height: 2.3; color: #444; font-size: 18px; text-align: justify; }
        
        /* 浅色高亮提示词 */
        .clickable-word {
            color: #00796b; /* 稍微深一点的青色 */
            background-color: var(--light-highlight);
            border-radius: 4px;
            padding: 0 4px;
            margin: 0 2px;
            display: inline;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .clickable-word:active { opacity: 0.6; }

        /* --- 3. 查词弹出框 (带边界自适应逻辑) --- */
        #lookup-popup {
            position: fixed; display: none; z-index: 1100;
            background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            padding: 14px; width: 220px;
            pointer-events: auto;
            transition: top 0.2s, left 0.2s;
        }
        /* 小箭头 */
        #lookup-popup::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); border-left: 8px solid transparent;
            border-right: 8px solid transparent; border-top: 8px solid white;
        }
        .pop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .popup-word { font-weight: 800; color: var(--primary-color); font-size: 17px; }
        .popup-def { font-size: 14px; color: #555; line-height: 1.5; }

        /* --- 4. 顶部进度条 --- */
        .header-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            padding: 0 20px; display: none; align-items: center; gap: 15px; z-index: 100;
        }
        .progress-num { font-size: 16px; color: #4b5157; min-width: 45px; font-weight: 500; }
        .progress-track { flex: 1; height: 5px; background: #e0e6e6; border-radius: 3px; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.4s ease; }
        .gift-icon { font-size: 18px; filter: grayscale(1); transition: 0.3s; }
        .gift-icon.active { filter: grayscale(0); animation: bounce 0.6s infinite alternate; }

        /* --- 5. 快闪卡 --- */
        .swiper-container { height: 100vh; width: 100%; position: relative; touch-action: none; display: none; }
        .card-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.2);
        }
        .card { width: 90%; max-width: 340px; height: 480px; perspective: 1000px; }
        .card-inner {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card.is-flipped .card-inner { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: #fff; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 25px; text-align: center;
        }
        .card-back { transform: rotateY(180deg); }

        .timer-box { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; }
        .timer-svg { transform: rotate(-90deg); }
        .timer-bg { fill: none; stroke: #f0f0f0; stroke-width: 3; }
        .timer-bar {
            fill: none; stroke: var(--primary-color); stroke-width: 3;
            stroke-dasharray: 113; stroke-dashoffset: 0;
        }
        .timer-num {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; font-size: 13px; font-weight: bold; color: var(--primary-color);
        }

        .cat-icon {
            width: 40px; height: 40px; background: var(--primary-color); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin-bottom: 20px;
        }
        .word { font-size: 34px; font-weight: bold; color: var(--text-main); margin-bottom: 4px; }
        .ipa { font-size: 16px; color: var(--text-sub); margin-bottom: 30px; }
        .sentence-box {
            font-size: 16px; color: #555; line-height: 1.6; background: #f8fafb;
            padding: 15px; border-radius: 12px; opacity: 0; transition: 0.5s;
        }
        .sentence-box.show { opacity: 1; }
        .sentence-box b { color: var(--text-main); border-bottom: 2px solid var(--primary-color); }
        .def-text { font-size: 19px; color: #333; margin-bottom: 40px; }
        .back-link { font-size: 14px; color: var(--primary-color); border-bottom: 1px solid; cursor: pointer; }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.15); } }
    </style>
</head>
<body>

    <div id="start-screen">
        <h2 style="margin-bottom: 10px;">IELTS 核心词精读</h2>
        <p style="color: #888; margin-bottom: 30px; font-size: 14px;">阅读文章，点击浅色单词查看释义</p>
        <button class="btn-main" onclick="showArticle()">开启挑战</button>
    </div>

    <div id="article-screen">
        <h3 style="color: var(--primary-color); margin-bottom: 10px;">The Evolution of Work</h3>
        <div class="article-scroll" id="scroll-box" onclick="closePopup()">
            <div class="article-content" id="article-text"></div>
            <div id="lookup-popup">
                <div class="pop-header">
                    <div class="popup-word" id="pop-w">word</div>
                </div>
                <div class="popup-def" id="pop-d">definition</div>
            </div>
        </div>
        <button class="btn-main" onclick="startFlash()">开始快闪记忆</button>
    </div>

    <div class="header-nav" id="nav">
        <div class="progress-num" id="p-num">1/10</div>
        <div class="progress-track"><div class="progress-fill" id="p-fill"></div></div>
        <div class="gift-icon" id="gift">🎁</div>
    </div>

    <div class="swiper-container" id="swiper"></div>

    <script>
        const vocabData = [
            { w: "hierarchical", p: "/ˌhaɪəˈrɑːkɪkl/", c: "adj. 等级制的，分层的", cat: "H", s: "In modern companies, the traditional hierarchical structure is being challenged." },
            { w: "abandon", p: "/əˈbændən/", c: "v. 抛弃，放弃", cat: "A", s: "Some tech giants decided to abandon strict office hours." },
            { w: "eliminate", p: "/ɪˈlɪmɪneɪt/", c: "v. 消除，排除", cat: "E", s: "This move aims to eliminate unnecessary stress for employees." },
            { w: "feasible", p: "/ˈfiːzəbl/", c: "adj. 可行的，可能的", cat: "F", s: "They wonder if a four-day work week is actually feasible." },
            { w: "inevitable", p: "/ɪnˈevɪtəbl/", c: "adj. 不可避免的", cat: "I", s: "However, it is inevitable that work culture must evolve." },
            { w: "collaborate", p: "/kəˈlæbəreɪt/", c: "v. 合作，协作", cat: "C", s: "Remote tools allow teams to collaborate across different time zones." },
            { w: "beneficial", p: "/ˌbenɪˈfɪʃl/", c: "adj. 有益的，有利的", cat: "B", s: "Flexible schedules are beneficial for maintaining a work-life balance." },
            { w: "deteriorate", p: "/dɪˈtɪəriəreɪt/", c: "v. 恶化，变坏", cat: "D", s: "Without clear rules, team productivity might deteriorate." },
            { w: "guarantee", p: "/ˌɡærənˈtiː/", c: "v./n. 保证，担保", cat: "G", s: "Focusing on output rather than hours will guarantee better results." },
            { w: "justify", p: "/ˈdʒʌstɪfaɪ/", c: "v. 证明...有理", cat: "J", s: "It is hard to justify why everyone must sit in a cubicle all day." }
        ];

        function showArticle() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('article-screen').style.display = 'flex';
            
            const articleStr = `In modern companies, the traditional <span class="clickable-word" data-idx="0">hierarchical</span> structure is being challenged. 
                Some tech giants decided to <span class="clickable-word" data-idx="1">abandon</span> strict office hours. 
                This move aims to <span class="clickable-word" data-idx="2">eliminate</span> unnecessary stress for employees. 
                They wonder if a four-day work week is actually <span class="clickable-word" data-idx="3">feasible</span>. 
                However, it is <span class="clickable-word" data-idx="4">inevitable</span> that work culture must evolve. 
                Remote tools allow teams to <span class="clickable-word" data-idx="5">collaborate</span> across different time zones. 
                Flexible schedules are <span class="clickable-word" data-idx="6">beneficial</span> for maintaining a work-life balance. 
                Without clear rules, team productivity might <span class="clickable-word" data-idx="7">deteriorate</span>. 
                Focusing on output rather than hours will <span class="clickable-word" data-idx="8">guarantee</span> better results. 
                It is hard to <span class="clickable-word" data-idx="9">justify</span> why everyone must sit in a cubicle all day.`;
            
            document.getElementById('article-text').innerHTML = articleStr;

            document.querySelectorAll('.clickable-word').forEach(word => {
                word.onclick = (e) => {
                    e.stopPropagation();
                    const idx = e.target.getAttribute('data-idx');
                    showPopup(e.target, idx);
                };
            });
        }

        // --- 智能边界定位函数 ---
        function showPopup(targetEl, idx) {
            const popup = document.getElementById('lookup-popup');
            const data = vocabData[idx];
            
            document.getElementById('pop-w').innerText = data.w;
            document.getElementById('pop-d').innerText = data.c;

            popup.style.display = 'block';

            const rect = targetEl.getBoundingClientRect();
            const popupWidth = popup.offsetWidth;
            const viewportWidth = window.innerWidth;
            const padding = 15; // 边距缓冲

            // 计算理想 Left (单词中心)
            let left = rect.left + (rect.width / 2) - (popupWidth / 2);
            
            // 边界检查：防止溢出右侧
            if (left + popupWidth > viewportWidth - padding) {
                left = viewportWidth - popupWidth - padding;
            }
            // 边界检查：防止溢出左侧
            if (left < padding) {
                left = padding;
            }

            // 计算 Top (单词上方)
            const top = rect.top - popup.offsetHeight - 12;

            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;

            // 动态调整小箭头位置，使其始终对准单词中心
            const arrowOffset = (rect.left + rect.width/2) - left;
            popup.style.setProperty('--arrow-left', `${arrowOffset}px`);
        }
        // CSS 变量支持箭头移动
        document.head.insertAdjacentHTML('beforeend', `<style>#lookup-popup::after{left: var(--arrow-left, 50%) !important;}</style>`);

        function closePopup() { document.getElementById('lookup-popup').style.display = 'none'; }

        function startFlash() {
            document.getElementById('article-screen').style.display = 'none';
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('swiper').style.display = 'block';
            initCards();
        }

        /* --- 快闪逻辑保持同步 --- */
        let currentIndex = 0;
        let isAnimating = false;

        function initCards() {
            const container = document.getElementById('swiper');
            container.innerHTML = "";
            vocabData.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                wrapper.style.transform = `translateY(${index * 100}%)`;
                const displaySent = item.s.replace(new RegExp(item.w, 'i'), `<b>${item.w}</b>`);
                wrapper.innerHTML = `
                    <div class="card" id="card-${index}">
                        <div class="card-inner">
                            <div class="card-face card-front">
                                <div class="timer-box">
                                    <svg class="timer-svg" width="44" height="44">
                                        <circle class="timer-bg" cx="22" cy="22" r="18"></circle>
                                        <circle class="timer-bar" id="bar-${index}" cx="22" cy="22" r="18"></circle>
                                    </svg>
                                    <div class="timer-num" id="text-${index}">3s</div>
                                </div>
                                <div class="cat-icon">${item.cat}</div>
                                <div class="word">${item.w}</div>
                                <div class="ipa">${item.p}</div>
                                <div class="sentence-box" id="sbox-${index}">${displaySent}</div>
                            </div>
                            <div class="card-face card-back">
                                <div class="cat-icon">${item.cat}</div>
                                <div class="word">${item.w}</div>
                                <div class="ipa">${item.p}</div>
                                <div class="def-text">${item.c}</div>
                                <div class="back-link" onclick="backToArticle()">📖 查看上下文原文</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
            runSequence(0);
        }

        async function runSequence(idx) {
            updateProgress(idx);
            const bar = document.getElementById(`bar-${idx}`);
            const text = document.getElementById(`text-${idx}`);
            const sbox = document.getElementById(`sbox-${idx}`);
            const card = document.getElementById(`card-${idx}`);
            await animateTimer(bar, text, 3);
            sbox.classList.add('show');
            await animateTimer(bar, text, 3);
            card.classList.add('is-flipped');
        }

        function animateTimer(bar, textEl, seconds) {
            return new Promise(resolve => {
                let timeLeft = seconds;
                bar.style.transition = 'none';
                bar.style.strokeDashoffset = '0';
                setTimeout(() => {
                    bar.style.transition = `stroke-dashoffset ${seconds}s linear`;
                    bar.style.strokeDashoffset = '113';
                }, 50);
                textEl.innerText = timeLeft + 's';
                const itv = setInterval(() => {
                    timeLeft--;
                    if(timeLeft >= 0) textEl.innerText = timeLeft + 's';
                    if(timeLeft <= 0) { clearInterval(itv); resolve(); }
                }, 1000);
            });
        }

        function updateProgress(idx) {
            const current = idx + 1;
            document.getElementById('p-num').innerText = `${current}/10`;
            document.getElementById('p-fill').style.width = `${(current / 10) * 100}%`;
            if (current === 10) document.getElementById('gift').classList.add('active');
        }

        function backToArticle() {
            document.getElementById('swiper').style.display = 'none';
            document.getElementById('nav').style.display = 'none';
            document.getElementById('article-screen').style.display = 'flex';
        }

        let startY = 0;
        document.getElementById('swiper').addEventListener('touchstart', e => startY = e.touches[0].clientY);
        document.getElementById('swiper').addEventListener('touchend', e => {
            const endY = e.changedTouches[0].clientY;
            if (Math.abs(startY - endY) > 50 && !isAnimating) {
                if (startY > endY && currentIndex < 9) switchCard(currentIndex + 1);
                else if (startY < endY && currentIndex > 0) switchCard(currentIndex - 1);
            }
        });

        function switchCard(newIdx) {
            isAnimating = true;
            currentIndex = newIdx;
            const wrappers = document.querySelectorAll('.card-wrapper');
            wrappers.forEach((w, i) => w.style.transform = `translateY(${(i - currentIndex) * 100}%)`);
            setTimeout(() => { runSequence(currentIndex); isAnimating = false; }, 500);
        }
    </script>
</body>
</html>
